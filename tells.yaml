    added: "2026-10-31"

  # ==========================================
  # TIER 4: Phrase Templates & Rhetorical Frames (Weight: 4, Cap: 30)
  # ==========================================
  - id: "frame.negative_parallelism"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\bnot\\s+(only|just|merely|simply)\\b[^.!?;]{1,80}\\b(but|it'?s|rather)\\b"
    type: "regex"
    weight: 4.0
    era: "2023-26+"
    models: ["All Instruction-Tuned LLMs"]
    source: "Wikipedia AI Cleanup; Graphite (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.negation_reveal"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(it'?s|this\\s+is|that\\s+is|it\\s+was)n'?t\\s+(?:not\\s+)?(about\\s+)?\\w+[^.!?;]{0,40}[.;—,]\\s*(it'?s|it\\s+was|this\\s+is|but)\\b"
    type: "regex"
    weight: 4.0
    era: "2024-26+"
    models: ["GPT-4o", "GPT-5", "Claude"]
    source: "Wikipedia AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.reverse_contrast"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(rather\\s+than\\s+(simply|merely)|as\\s+opposed\\s+to\\s+merely|instead\\s+of\\s+merely)\\b"
    type: "regex"
    weight: 4.0
    era: "2025-26+"
    models: ["Claude Opus 5/5.5", "GPT-6 Astra"]
    source: "Graphite (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.flagging_importance_2026"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(this\\s+matters|that\\s+matters|why\\s+\\w+(\\s+\\w+)?\\s+matters|matters\\s+most|here'?s\\s+why|the\\s+real\\s+question\\s+is)\\b"
    type: "regex"
    weight: 4.0
    era: "2026+ Opus 5.5 / GPT-6"
    models: ["Claude Opus 5.5", "GPT-6"]
    source: "Graphite (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.significance_puffery"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b((stands|serves)\\s+as\\s+a\\s+(testament|reminder)|plays\\s+a\\s+(crucial|pivotal|vital)\\s+role|marks\\s+a\\s+pivotal\\s+moment|underscores\\s+(its|the)\\s+importance|reflects\\s+broader|setting\\s+the\\s+stage\\s+for|indelible\\s+mark|deeply\\s+rooted|evolving\\s+landscape|ever-evolving\\s+landscape|in\\s+today'?s\\s+fast-paced\\s+world)\\b"
    type: "regex"
    weight: 4.0
    era: "2023-25 GPT-4 / 4o"
    models: ["GPT-4", "GPT-4o"]
    source: "Wikipedia AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.superficial_ing_tail"
    tier: 4
    category: "rhetorical_frame"
    pattern: ",\\s+(?:ultimately\\s+|thereby\\s+|thus\\s+)?(highlight|underscor|emphasiz|reflect|symboliz|ensur|foster|contribut|showcas|pav)ing\\b[^.!?\\n]{3,75}[.!?]"
    type: "regex"
    weight: 4.0
    era: "2023-26+"
    models: ["All Instruction-Tuned LLMs"]
    source: "Reinhart et al. (PNAS 2025); Wikipedia AI Cleanup"
    added: "2026-10-31"

  - id: "frame.promotional_tone"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(boasts\\s+a|nestled\\s+in|in\\s+the\\s+heart\\s+of|rich\\s+cultural\\s+heritage|diverse\\s+array\\s+of|natural\\s+beauty|unwavering\\s+commitment\\s+to)\\b"
    type: "regex"
    weight: 4.0
    era: "2023-26+"
    models: ["GPT-4", "GPT-4o", "GPT-5"]
    source: "Wikipedia AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.vague_attribution_notability"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(experts\\s+argue|observers\\s+note|industry\\s+reports\\s+suggest|some\\s+critics\\s+argue|widely\\s+regarded\\s+as|featured\\s+in\\s+major|profiled\\s+in|independent\\s+coverage|maintains\\s+an\\s+active\\s+social\\s+media\\s+presence)\\b"
    type: "regex"
    weight: 4.0
    era: "2025-26 GPT-5"
    models: ["GPT-5", "GPT-4o"]
    source: "Wikipedia AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.hedging_source_disclaimers_2026"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(while\\s+specific\\s+details\\s+are\\s+limited|not\\s+widely\\s+documented|based\\s+on\\s+available\\s+information|in\\s+the\\s+provided\\s+sources|should\\s+be\\s+treated\\s+as\\s+[^.,;]{2,30}\\s+rather\\s+than|does\\s+not\\s+by\\s+itself\\s+establish|should\\s+not\\s+be\\s+confused\\s+with)\\b"
    type: "regex"
    weight: 4.0
    era: "2026+ GPT-6 / Mid-2026"
    models: ["GPT-6 Astra", "GPT-5.6", "Claude Opus 5.5"]
    source: "Wikipedia AI Cleanup (Oct 2026); Graphite (Oct 2026)"
    added: "2026-10-31"

  - id: "frame.didactic_asides_conclusions"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(it'?s\\s+important\\s+to\\s+note|it\\s+is\\s+important\\s+to\\s+note|it'?s\\s+worth\\s+noting|it\\s+is\\s+worth\\s+noting|it'?s\\s+crucial\\s+to\\s+remember|despite\\s+(its|these|their)\\s+[^.,;]{0,45}challenges?|looking\\s+ahead|only\\s+time\\s+will\\s+tell|the\\s+bottom\\s+line\\s+is)\\b|(?:^|\\n|\\.[\\s]+)(In\\s+summary,|In\\s+conclusion,|Overall,|Ultimately,|At\\s+its\\s+core,|In\\s+essence,)"
    type: "regex"
    weight: 4.0
    era: "2023-26+"
    models: ["All Instruction-Tuned LLMs"]
    source: "Wikipedia AI Cleanup; Liang et al. (2024)"
    added: "2026-10-31"

  - id: "frame.customer_service_corporate"
    tier: 4
    category: "rhetorical_frame"
    pattern: "\\b(i\\s+hope\\s+this\\s+(message|email)\\s+finds\\s+you\\s+well|i\\s+hope\\s+this\\s+finds\\s+you\\s+well|i\\s+understand\\s+your\\s+concerns|apologize\\s+for\\s+any\\s+inconvenience|please\\s+don'?t\\s+hesitate\\s+to\\s+reach\\s+out|at\\s+your\\s+earliest\\s+convenience|circle\\s+back|gentle\\s+reminder|as\\s+we\\s+navigate)\\b"
    type: "regex"
    weight: 4.0
    era: "2023-26+"
