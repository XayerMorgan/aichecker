    weight: 3.0
    ratio: 576.0
    era: "2026+ GPT-6 Astra"
    models: ["GPT-6 Astra"]
    source: "Graphite AI Tells (Oct 2026) — 576x human"
    added: "2026-10-31"

  - id: "lex.does_not_establish"
    tier: 3
    category: "lexicon_high_ratio"
    pattern: "\\bdoes\\s+not\\s+(by\\s+itself\\s+)?establish\\b"
