    models: ["Claude Opus 5.5"]
    source: "Graphite AI Tells (Oct 2026) — 92x human"
    added: "2026-10-31"

  - id: "lex.dependable"
    tier: 3
    category: "lexicon_high_ratio"
    pattern: "\\bdependable\\b"
    type: "regex"
    weight: 3.0
    ratio: 59.0
    era: "2026+ GPT-6 / Opus 5.5"
