    models: ["GPT-6", "Grok"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "lex.folk_half_weight"
    tier: 3
    category: "lexicon_era_folk"
    pattern: "\\b(synergy|paradigm|ecosystem|cornerstone|beacon|symphony|treasure\\s+trove|game-changer|embark(s|ed|ing)?|unleash(es|ed|ing)?|unlock(s|ed|ing)?|harness(es|ed|ing)?|spearhead(s|ed|ing)?|revolutioniz(e|es|ed|ing)|streamlin(e|es|ed|ing))\\b"
    type: "regex"
    weight: 0.75
