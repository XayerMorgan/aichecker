  # Tier 3B: Era-Specific & Folk Master Lexicon (weight 1.5, cap 15)
  - id: "lex.era_2023_24_gpt4"
    tier: 3
    category: "lexicon_era_folk"
    pattern: "\\b(tapestry|testament|interplay|realm|pivotal|crucial|foster(s|ed|ing)?|bolster(s|ed|ing)?|garner(s|ed|ing)?|vibrant|enduring|boasts|multifaceted|nuanced|nuance|landscape)\\b"
    type: "regex"
    weight: 1.5
    era: "2023-24 GPT-4"
    models: ["GPT-4", "Claude 2/3"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026); Juzek & Ward (COLING 2025)"
    added: "2026-10-31"

  - id: "lex.era_2024_25_gpt4o"
    tier: 3
    category: "lexicon_era_folk"
    pattern: "\\b(align(s|ed|ing)?\\s+with|enhanc(e|es|ed|ing)|emphasiz(e|es|ed|ing)|highlight(s|ed|ing)|facilitat(e|es|ed|ing)|encompass(es|ed|ing)?|illuminat(e|es|ed|ing)|groundbreaking|transformative|invaluable|seamless(ly)?|robust)\\b"
    type: "regex"
    weight: 1.5
    era: "2024-25 GPT-4o"
