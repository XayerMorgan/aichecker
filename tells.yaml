# AI Tell Checker — Versioned Lexicon & Rule Specification (tells.yaml)
# Version: 3.4.0
# Updated: 2026-10-31
# Author/Reference: @Matthew Jett Hal — "AI Writing Tells: Detection Reference for AI Tell Checker"

version: "3.4.0"
updated: "2026-10-31"
baselines:
  em_dash_per_1k: 3.14
  classic_8_words_per_1k_human: 0.44
  classic_8_words_per_1k_2024_ai: 2.62
  classic_8_words_per_1k_2026_ai: 0.31
  nominalizations_per_1k_human: 28.0
  participial_clauses_per_1k_human: 3.5
  mean_word_length_human: 4.85
  rule_of_three_per_1k_threshold: 10.0

rules:
  # ==========================================
  # TIER 1: Unambiguous Deterministic Artifacts (Sets score floor at 90)
  # ==========================================
  - id: "t1.oaicite"
    tier: 1
    category: "artifact_citation"
    pattern: "contentReference\\[oaicite:\\d+\\]|\\boaicite\\b|\\bturn0(search|news)\\d*\\b|【\\d+†[^】]+】|\\[\\d+†L\\d+(-L\\d+)?\\]"
    type: "regex"
    weight: 90
    era: "2023-26+"
    models: ["ChatGPT", "OpenAI Search"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.utm_tracker"
    tier: 1
    category: "artifact_url"
    pattern: "utm_source=(chatgpt\\.com|openai|copilot\\.com)|referrer=grok\\.com"
    type: "regex"
    weight: 90
    era: "2024-26+"
    models: ["ChatGPT", "Copilot", "Grok"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.self_id"
    tier: 1
    category: "artifact_self_id"
    pattern: "\\b(as an ai language model|as a large language model|i'?m sorry, but i can'?t|i cannot offer medical advice, but)\\b"
    type: "regex"
    weight: 90
    era: "2022-23"
    models: ["GPT-3.5", "Early GPT-4", "Claude 1/2"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.cutoff_disclaimer"
    tier: 1
    category: "artifact_cutoff"
    pattern: "\\b(as of my last knowledge update|up to my last training update|as of my knowledge cutoff)\\b"
    type: "regex"
    weight: 90
    era: "2022-24"
    models: ["GPT-3.5", "GPT-4"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.chat_residue"
    tier: 1
    category: "artifact_chat_residue"
    pattern: "(?:^|\\n)\\s*(Certainly!|Of course!|Great question!|You'?re absolutely right!|Sure, here is|Here is a )|(?:\\b(I hope this helps!?|Let me know if you'?d like|Would you like me to|Is there anything else you|for a more detailed breakdown)\\b)"
    type: "regex"
    weight: 90
    era: "2023-26+"
    models: ["All Chat Tuned LLMs"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.unfilled_template"
    tier: 1
    category: "artifact_template"
    pattern: "\\[(Your|Insert|Company|Describe)[^\\]]*\\]|\\bPASTE_[A-Z0-9_]+_HERE\\b|\\b20\\d\\d-(XX|xx)-(XX|xx)\\b"
    type: "regex"
    weight: 90
    era: "2023-26+"
    models: ["All Chat Tuned LLMs"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.footnote_arrow"
    tier: 1
    category: "artifact_markup"
    pattern: "↩\\d*"
    type: "regex"
    weight: 90
    era: "2024-26+"
    models: ["ChatGPT", "Perplexity", "Claude"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  - id: "t1.gemini_mark"
    tier: 1
    category: "artifact_markup"
    pattern: "<mark>[^<]{10,}</mark>"
    type: "regex"
    weight: 90
    era: "2024-26+"
    models: ["Google Gemini"]
    source: "Wikipedia WikiProject AI Cleanup (Oct 2026)"
    added: "2026-10-31"

  # ==========================================
  # TIER 2: Punctuation, Typography & Invisible Unicode
  # ==========================================
  - id: "t2.unicode_nnbsp"
    tier: 2
    category: "invisible_unicode"
    pattern: "\\u202F"
    type: "raw_unicode"
    weight: 8
    era: "2025-26 GPT-5 / o3 / o4-mini"
    models: ["OpenAI o3", "o4-mini", "GPT-5"]
    source: "Rumi (Apr 2025); Layer3 Labs; Pillitteri (2025)"
    added: "2026-10-31"

  - id: "t2.unicode_zwsp"
    tier: 2
    category: "invisible_unicode"
    pattern: "[\\u200B\\u200C\\u200D\\u2060\\uFEFF\\u200E\\u200F]"
    type: "raw_unicode"
    weight: 8
    era: "2023-26+"
    models: ["Unedited Chat Paste"]
    source: "Pillitteri (2025)"
    added: "2026-10-31"

  - id: "t2.emdash_elevated"
    tier: 2
    category: "punctuation_era"
    pattern: "—"
    type: "rate_check"
    weight: 10
    era: "2023-25 GPT-4 / GPT-4.1 / GPT-5"
    models: ["GPT-4.1 (7.13/1k)", "GPT-5 (6.92/1k)"]
    source: "Graphite (Oct 2026); arXiv:2603.27006; Czuma (2026)"
    added: "2026-10-31"

  # ==========================================
  # TIER 3: Measured Lexical Markers (High Ratio >= 10x & Era Lexicon)
